# Application Name
spring.application.name=EmergencyAndMentalWellbeing

# Server Configuration
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/EMProject
spring.data.mongodb.database=EMProject

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

gemini.api.key=YOUR OWN GEMINI API KEY
newsapi.key=YOUR OWN NEWS API KEY FROM NEWS.ORG
youtube.api.key=YOUTUBE API KEY FROM GOOGLE
news.cache.duration=86400000
